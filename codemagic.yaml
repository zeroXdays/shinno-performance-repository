# Cloud Mac build → App Store Connect (no personal Mac required).
#
# IMPORTANT: Codemagic must clone THIS GitHub repo:
#   https://github.com/zeroXdays/shinno-performance-repository
# Cursor agents push to Origin (shinno-performance-control) which is NOT mirrored.
# After glyph/mode fixes on Origin, sync main → GitHub or TestFlight stays on old builds.
# See appstore/SYNC_TO_TESTFLIGHT.md
#
# One-time Codemagic setup:
# 1. Connect this GitHub repo
# 2. Teams → Integrations → App Store Connect → name the integration exactly `shinno`
# 3. Environment group `appstore` with:
#      APPLE_TEAM_ID
#    (Issuer/Key/P8 live on the App Store Connect integration — not required again here)
#    Optional override: APP_STORE_APPLE_ID (defaults below to the Connect app id)
# 4. Start workflow "Shinno Sync → App Store Connect"

workflows:
  ios-app-store:
    name: Shinno Sync → App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: shinno
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shinnoperformance.lights
      vars:
        XCODE_PROJECT: "ios/ShinnoLights.xcodeproj"
        XCODE_SCHEME: "ShinnoLights"
        BUNDLE_ID: "com.shinnoperformance.lights"
        # Numeric App Store Connect Apple ID for Shinno Sync.
        # Do NOT write `$APP_STORE_APPLE_ID` here — that ships as a literal and breaks
        # build-number + publish. Group override still wins when set to a number.
        APP_STORE_APPLE_ID: "6830956380"
      groups:
        - appstore
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Validate App Store Connect env
        script: |
          set -euo pipefail
          echo "BUNDLE_ID=$BUNDLE_ID"
          echo "APP_STORE_APPLE_ID=$APP_STORE_APPLE_ID"
          echo "APPLE_TEAM_ID=${APPLE_TEAM_ID:-<will resolve from App Store Connect>}"
          if [[ ! "${APP_STORE_APPLE_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: APP_STORE_APPLE_ID must be the numeric Connect app id (got '${APP_STORE_APPLE_ID:-}')." >&2
            echo "Remove any APP_STORE_APPLE_ID=\$APP_STORE_APPLE_ID self-reference from the env group." >&2
            exit 1
          fi
      - name: Fetch or create signing files
        script: |
          set -euo pipefail
          # --create makes the App Store profile + cert if Apple doesn't have them yet
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set team on Xcode project
        script: |
          set -euo pipefail
          # Optional: env group APPLE_TEAM_ID, else TeamIdentifier from the fetched profile.
          # xcode-project use-profiles usually stamps the team too — empty here is OK.
          TEAM="${APPLE_TEAM_ID:-}"
          if [ -z "$TEAM" ]; then
            TEAM=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name '*.mobileprovision' 2>/dev/null \
              | while read -r prof; do
                  security cms -D -i "$prof" 2>/dev/null \
                    | awk '/TeamIdentifier/{getline; gsub(/[^A-Z0-9]/,""); if (length($0)==10) {print; exit}}'
                done | head -1 || true)
          fi
          echo "DEVELOPMENT_TEAM -> ${TEAM:-<leave for use-profiles>}"
          if [ -n "$TEAM" ]; then
            sed -i.bak "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = $TEAM;/g" \
              ios/ShinnoLights.xcodeproj/project.pbxproj
          fi
      - name: Increment iOS build number
        script: |
          # App Store Connect rejects reuse of the same CFBundleVersion.
          # Take the max of TestFlight, App Store, checked-in version, and Codemagic
          # PROJECT_BUILD_NUMBER — then +1 so every upload is unique.
          set -euo pipefail
          PBX="ios/ShinnoLights.xcodeproj/project.pbxproj"
          if [[ ! "${APP_STORE_APPLE_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: APP_STORE_APPLE_ID='$APP_STORE_APPLE_ID' is not numeric" >&2
            exit 1
          fi
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null || true)
          LATEST_AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null || true)
          CHECKED_IN=$(grep -oE 'CURRENT_PROJECT_VERSION = [0-9]+' "$PBX" | head -1 | grep -oE '[0-9]+' || echo 0)
          LATEST=0
          for n in "$LATEST_TF" "$LATEST_AS" "$CHECKED_IN" "${PROJECT_BUILD_NUMBER:-0}"; do
            if [[ "${n:-}" =~ ^[0-9]+$ ]] && (( n > LATEST )); then
              LATEST=$n
            fi
          done
          NEW=$((LATEST + 1))
          if (( NEW <= 1 )); then NEW=2; fi
          echo "CFBundleVersion sources: TF=${LATEST_TF:-none} AS=${LATEST_AS:-none} checked-in=$CHECKED_IN CM=${PROJECT_BUILD_NUMBER:-none}"
          echo "CFBundleVersion -> $NEW (previous max was $LATEST)"
          sed -i.bak "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" "$PBX"
          AFTER=$(grep -oE 'CURRENT_PROJECT_VERSION = [0-9]+' "$PBX" | sort -u)
          echo "pbxproj now: $AFTER"
          if ! grep -q "CURRENT_PROJECT_VERSION = $NEW;" "$PBX"; then
            echo "ERROR: failed to write CURRENT_PROJECT_VERSION=$NEW" >&2
            exit 1
          fi
      - name: Build IPA
        script: |
          cd ios
          xcode-project build-ipa \
            --project "ShinnoLights.xcodeproj" \
            --scheme "$XCODE_SCHEME"
      - name: Verify IPA build number
        script: |
          set -euo pipefail
          IPA=$(ls ios/build/ios/ipa/*.ipa | head -1)
          echo "Inspecting $IPA"
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          PLIST=$(find "$TMP" -name Info.plist | head -1)
          # Prefer PlistBuddy on macOS builders
          if [ -x /usr/libexec/PlistBuddy ]; then
            VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
            BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          else
            VER=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
            BUILD=$(plutil -extract CFBundleVersion raw "$PLIST")
          fi
          echo "IPA version $VER ($BUILD)"
          if [[ ! "$BUILD" =~ ^[0-9]+$ ]] || (( BUILD <= 1 )); then
            echo "ERROR: IPA CFBundleVersion=$BUILD must be > 1 (Apple already has build 1)" >&2
            exit 1
          fi
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Leave false until screenshots + listing are done in Connect
        submit_to_app_store: false
